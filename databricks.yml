bundle:
  name: battlecards_review_postgres

resources:
  apps:
    battlecards_review:
      name: battlecards-review-pg
      description: "Battlecards review app (Lakebase Postgres)"
      source_code_path: .
      resources:
        - name: app-database
          database:
            database_name: databricks_postgres
            instance_name: "battlestation"
            permission: CAN_CONNECT_AND_CREATE
        - name: exa_api_key
          secret:
            scope: battlecards-review-pg-secrets
            key: exa_api_key
            permission: READ

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fe-vm-pmt.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://fe-vm-pmt.cloud.databricks.com
