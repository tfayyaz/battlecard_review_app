bundle:
  name: battlecards_review_postgres

resources:
  database_catalogs:
    battlecards_prod_catalog:
      database_instance_name: "instance-98170129-d87f-4357-b0ce-8991c128dea8"
      name: battlecards-prod-catalog
      database_name: battlecards_prod
      create_database_if_not_exists: true

  apps:
    battlecards_review:
      name: battlecards-review-pg
      description: "Battlecards review app (Lakebase Postgres)"
      source_code_path: .
      resources:
        - name: app-database
          database:
            database_name: battlecards_prod
            instance_name: "instance-98170129-d87f-4357-b0ce-8991c128dea8"
            permission: CAN_CONNECT_AND_CREATE

variables:
  workspace_host:
    default: https://fe-vm-pmt.cloud.databricks.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.workspace_host}
  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
